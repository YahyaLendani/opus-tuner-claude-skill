name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # The version is the one thing every doc repeats, so let the build check it
      # instead of trusting a release checklist. VERSION is the source of truth.
      - name: Version is consistent
        shell: powershell
        run: |
          $v = (Get-Content skills/opus-tuner/VERSION -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION is not semver: '$v'" }
          $readme = Get-Content README.md -Raw
          if ($readme -notmatch "(?m)^> \*\*Status:\*\* $([regex]::Escape($v))\.") {
            throw "README status line does not match VERSION $v"
          }
          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -notmatch "(?m)^## \[$([regex]::Escape($v))\]") {
            throw "CHANGELOG has no '$v' entry"
          }
          Write-Host "version $v consistent across VERSION, README and CHANGELOG"

      - name: Every script parses
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs) {
              Write-Host "parse error: $($_.FullName)"
              $errs | ForEach-Object { Write-Host "  $($_.Message)" }
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Self-test
        shell: powershell
        run: ./skills/opus-tuner/scripts/selftest.ps1 -Interpreter powershell -BudgetMs 3000

      - name: Installer test
        shell: powershell
        run: ./tests/install-test.ps1

  windows-pwsh-7:
    name: Windows pwsh 7 (non-blocking)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Self-test under pwsh
        shell: pwsh
        run: ./skills/opus-tuner/scripts/selftest.ps1 -Interpreter pwsh -BudgetMs 5000

      - name: Installer test under pwsh
        shell: pwsh
        run: ./tests/install-test.ps1

  posix:
    name: ${{ matrix.os }} (pwsh 7)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: pwsh version
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: Every script parses
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs) {
              Write-Host "parse error: $($_.FullName)"
              $errs | ForEach-Object { Write-Host "  $($_.Message)" }
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Self-test
        shell: pwsh
        run: ./skills/opus-tuner/scripts/selftest.ps1 -Interpreter pwsh -BudgetMs 3000

      - name: Installer test
        shell: pwsh
        run: ./tests/install-test.ps1

      - name: install.sh wrapper (executable, LF, passes switches)
        shell: bash
        run: |
          set -eu
          test -x install.sh
          export CLAUDE_CONFIG_DIR="$(mktemp -d)"
          ./install.sh -DryRun | grep -q 'dry run complete'
          ./install.sh -NoHooks >/dev/null
          test -d "$CLAUDE_CONFIG_DIR/skills/opus-tuner"
          test -f "$CLAUDE_CONFIG_DIR/CLAUDE.md"
          test ! -f "$CLAUDE_CONFIG_DIR/settings.json"
