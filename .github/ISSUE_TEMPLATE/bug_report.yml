name: Bug report
description: A hook does not fire, a ceiling is wrong, or the installer misbehaves.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Run the doctor first.** It answers most "nothing fires" reports, and its
        output is the fastest way to a fix:

        ```powershell
        powershell -NoProfile -File "$env:USERPROFILE\.claude\skills\opus-tuner\scripts\doctor.ps1"
        ```

        ```sh
        pwsh -NoProfile -File "$HOME/.claude/skills/opus-tuner/scripts/doctor.ps1"
        ```

        The `-Json` output contains file paths and setting names only — no prompt
        text and no transcript content.

  - type: input
    id: version
    attributes:
      label: opus-tuner version
      description: The `version` field from `doctor.ps1 -Json`, or the number in the installer banner.
      placeholder: "0.4.0"
    validations:
      required: true

  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: Output of `claude --version`, or the app version for VS Code / Desktop.
      placeholder: "2.1.312"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10 or 11
        - macOS
        - Linux
        - WSL
    validations:
      required: true

  - type: input
    id: powershell
    attributes:
      label: PowerShell version
      description: Output of `$PSVersionTable.PSVersion`.
      placeholder: "5.1.22621.4249"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where it happens
      description: Hooks load differently in each of these.
      options:
        - Terminal
        - VS Code extension
        - Desktop app
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste the result of `doctor.ps1 -Json`.
      render: json
    validations:
      required: true

  - type: textarea
    id: hooks
    attributes:
      label: What `/hooks` lists
      description: Optional, but it settles "registered but not firing" in one look.
      render: text

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
        - label: I removed any secrets, tokens or transcript excerpts from this report.
          required: true
